name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  APP_NAME: rusc_xlsx
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  NODE_VERSION: '26.13.1'
  RUST_VERSION: '1.100.0'
  RUST_MSRV: '1.95.0'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # `prepare` builds wrapper.js + wrapper.d.ts from wrapper.ts with tsdown.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting (oxfmt, rustfmt)
        run: npm run fmt:check

      - name: Lint JavaScript (oxlint)
        run: npm run lint -- --format github

      - name: Lint Rust (clippy)
        run: npm run lint:rust

      - name: Lint package (publint, attw)
        run: npm run lint:package

      - name: Typecheck
        run: npm run typecheck

      # Re-derives test call sites, counts and the dashboard from the markdown
      # and checks the pinned rust_xlsxwriter matches Cargo.lock; no nightly needed.
      - name: Check coverage checklist
        run: npm run coverage:check

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check minimum supported Rust version
        run: cargo check --locked

  test:
    name: Test ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install dependencies
        run: npm ci

      - name: Build native module
        run: npm run build

      - name: Run tests (Vitest)
        run: npm test

  release-bindings:
    name: Build ${{ matrix.settings.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, msrv, test]
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: i686-pc-windows-msvc
            build: npm run build -- --target i686-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: npm run build -- --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: npm run build -- --target x86_64-unknown-linux-musl -x

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.settings.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
          cache-directories: ~/.napi-rs

      - name: Setup Zig
        if: contains(matrix.settings.target, 'musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install cargo-zigbuild
        if: contains(matrix.settings.target, 'musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install dependencies
        run: npm ci

      - name: Build binding
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload binding
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  universal-macos:
    name: Build universal macOS binding
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download macOS x64 binding
        uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-apple-darwin
          path: artifacts/x64

      - name: Download macOS arm64 binding
        uses: actions/download-artifact@v8
        with:
          name: bindings-aarch64-apple-darwin
          path: artifacts/arm64

      - name: Move bindings to project root
        run: find artifacts -name '*.node' -exec cp {} . \;

      - name: Build universal binding
        run: npm run universal

      - name: Upload universal binding
        uses: actions/upload-artifact@v7
        with:
          name: bindings-universal-apple-darwin
          path: ${{ env.APP_NAME }}.darwin-universal.node
          if-no-files-found: error

  publish:
    name: Publish npm package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, msrv, test, release-bindings, universal-macos]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          node -e "const version = require('./package.json').version; const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Expected tag ' + expected + ', got ' + process.env.GITHUB_REF_NAME); process.exit(1) }"

      - name: Create npm package directories
        run: npx napi create-npm-dirs

      - name: Download all bindings
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Move bindings into npm packages
        run: npm run artifacts

      # `npm publish` first runs `napi prepublish` (prepublishOnly), which
      # publishes every platform package with a plain `npm publish`. Settings
      # passed as npm config through the environment reach all of them, so the
      # native binaries get the same dist-tag and provenance as the root package;
      # `publishConfig.access` is copied into each platform package.json.
      - name: Publish
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            export NPM_CONFIG_TAG=next
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
