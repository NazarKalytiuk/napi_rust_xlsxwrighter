[package]
name = "rusc-xlsx"
version = "2.4.0"
authors = ["Nazarii Kalytiuk <nazarkwork@gmail.com>"]
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Node.js bindings for rust_xlsxwriter using NAPI-RS"
repository = "https://github.com/NazarKalytiuk/napi_rust_xlsxwrighter"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.2", features = ["async", "tokio_rt", "napi9"] }
napi-derive = "3.7.1"
parking_lot = "0.13.0"
rust_xlsxwriter = { workspace = true }

[build-dependencies]
napi-build = "2.6.0"

[workspace]
members = ["benchmarks/pure-rust"]

# The addon and the pure Rust benchmarks inherit this one declaration, so the
# baseline they are compared against always compiles the same rust_xlsxwriter
# release and features as the published package.
[workspace.dependencies]
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory", "zmij"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
